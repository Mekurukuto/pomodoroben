html[data-view] .amb .sec{margin-bottom:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
html[data-view] .amb .ash{display:flex;justify-content:space-between;align-items:center;width:100%;padding:11px 12px;border:0;border-radius:0;background:var(--sf);text-align:left;font-weight:600}
html[data-view] .amb .badge{font-size:.62rem;padding:2px 8px;border-radius:99px;background:var(--ax);color:var(--axt);margin-left:8px;text-transform:uppercase;letter-spacing:.03em;font-weight:700}
html[data-view] .amb .arr{transition:transform .2s;color:var(--mute)}
html[data-view] .amb .sec:not(.open) .arr{transform:rotate(-90deg)}
html[data-view] .amb .asc{display:none;padding:4px 10px 10px}
html[data-view] .amb .sec.open .asc{display:block}
html[data-view] .amb .item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:10px 12px;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:transparent;text-align:left;font-weight:500}
html[data-view] .amb .item small{display:block;color:var(--mute);font-size:.75rem;font-weight:400}
html[data-view] .amb .item.on{border-color:var(--ax);background:color-mix(in srgb,var(--ax) 14%,transparent)}
html[data-view] .amb .item.dis{opacity:.45;cursor:not-allowed}
html[data-view] .amb .sw{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;flex-shrink:0;transition:background .2s}
html[data-view] .amb .sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
html[data-view] .amb .item.on .sw{background:var(--ax)}
html[data-view] .amb .item.on .sw::after{transform:translateX(18px)}
html[data-view] .amb .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.7rem;color:transparent;flex-shrink:0}
html[data-view] .amb .item.on .ck{background:var(--ax);border-color:var(--ax);color:var(--axt)}
html[data-view] .amb .warn{margin-top:8px;padding:8px 10px;border:1px solid #f39c12;background:rgba(243,156,18,.12);color:#e0a030;border-radius:10px;font-size:.8rem}
html[data-view] .amb .freqs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
html[data-view] .amb .fb{flex:1;min-width:84px;text-align:center;padding:10px 6px;border:1px solid var(--line);border-radius:10px;background:transparent}
html[data-view] .amb .fb b{display:block}
html[data-view] .amb .fb small{color:var(--mute);font-size:.7rem}
html[data-view] .amb .fb.on{background:var(--ax);border-color:var(--ax);color:var(--axt)}
html[data-view] .amb .fb.on small{color:var(--axt);opacity:.85}
html[data-view=minimal] .amb .item,html[data-view=minimal] .amb .ash{font-weight:500}
</style>
</head>

<div id="app"></div>
<div id="fx"></div>
<dialog id="dayDlg">
  <div class="r" style="justify-content:space-between"><h2 id="dayTitle" style="font-size:1.1rem"></h2><button id="closeDay">Close</button></div>

<!-- ================= ELEGANT VIEW ================= -->
<template id="t-elegant">
<header class="top"><div class="brand"><b>Pomodoro Ben</b><div class="views" id="views"><button data-v="elegant">Elegant</button><button data-v="minimal">Minimalist</button></div></div><div class="chips"><span id="streak"></span><span id="lvl"></span><button id="theme" aria-label="Switch light or dark mode">☀</button></div></header>

<main class="stage">

    <svg viewBox="0 0 280 280"><circle class="bg" cx="140" cy="140" r="128"/><circle id="arc" cx="140" cy="140" r="128"/></svg>
    <div class="center"><div id="time">25:00</div><input id="focusIn" placeholder="What's your one thing?" maxlength="60" aria-label="Current focus"></div>
  </div>
  <div class="track"><div id="bar"></div></div>
  <div class="row"><button class="go" id="start">Start focus</button><button class="ghost" id="reset">Reset</button></div>
  <div class="dots" id="dots" title="Daily goal"></div>
  <p id="quote"></p>
</main>

<nav class="dock">
  <button data-p="tasks"><span>☑</span>Tasks</button><button data-p="cal"><span>▦</span>Calendar</button><button data-p="sound"><span>♫</span>Sound</button>
  <button data-p="chess"><span>♞</span>Chess</button><button data-p="chat"><span>✉</span>Chat</button><button data-p="you"><span>✦</span>Progress</button>
</nav>

<aside id="sheet" aria-label="Panel">
  <div class="sh"><h2 id="sTitle"></h2><button id="sClose" aria-label="Close panel">✕</button></div>

  <section class="panel" id="p-tasks" hidden><h2 class="ph">Tasks</h2>
    <div class="r"><input id="taskIn" placeholder="Add a task"><button class="pri" id="addTask">Add</button></div>
    <ul id="tasks"></ul>
    <p class="mute" id="tasksEmpty">Nothing queued. Add the next thing you want to finish.</p>
  </section>

  <section class="panel" id="p-cal" hidden><h2 class="ph">Calendar</h2>
    <div class="r" style="justify-content:space-between"><button id="prev">‹</button><strong id="month"></strong><button id="next">›</button></div>
    <div id="grid"></div>
    <h3>Today's reflection</h3>
    <textarea id="note" placeholder="How did today go?"></textarea>
    <button class="pri" id="saveNote" style="width:100%">Save to today</button>
  </section>

  <section class="panel" id="p-sound" hidden><h2 class="ph">Soundscape</h2>
    <div class="r"><span class="mute">Master</span><input type="range" id="vol" min="0" max="1" step=".01" value=".5" style="flex:1;padding:0"><span class="mute" id="volVal">50%</span><button id="stopAll">Stop all</button></div>
    <div id="ambient" class="amb"></div>
  </section>

  <section class="panel" id="p-chess" hidden><h2 class="ph">Chess</h2>
    <div class="chessbox" id="chessBox">
      <div class="cbar"><span class="mute" id="chessTime"></span><button id="chessZoom" aria-label="Enlarge chess board" title="Enlarge"></button></div>
      <div class="r" style="justify-content:center">

        <select id="level"><option value="1">Beginner</option><option value="5" selected>Easy</option><option value="10">Medium</option><option value="15">Hard</option><option value="20">Master</option></select>
        <button id="newGame">New game</button><button id="undo">Undo</button>
      </div>
      <div class="wrap"><div id="board"></div><div id="overlay">Start a break timer to play.</div></div>
      <div id="cstatus">White to move</div><div id="pmsg"></div><p class="mute" id="think" hidden style="text-align:center">Stockfish is thinking…</p>
    </div>
  </section>

  <section class="panel" id="p-chat" hidden><h2 class="ph">Chat</h2>
    <div id="lobby"><button class="pri" id="newRoom" style="width:100%">Create private room</button><div id="rooms"></div></div>
    <div id="chat" hidden>
      <div class="r" style="justify-content:space-between"><strong id="roomName"></strong><span><button id="delRoom" hidden>Delete</button> <button id="leave">Leave</button></span></div>

    </div>
  </section>

  <section class="panel" id="p-you" hidden><h2 class="ph">Your progress</h2>

  </section>
</aside>
</template>

/* ---------- Audio core ---------- */
let ac,mg;
function getAC(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=$('vol').value;mg.connect(ac.destination)}ac.resume();return ac}

/* ---------- State & hooks ---------- */
const cfg=Object.assign({work:25,short:5,long:15,goal:4},ls.get('pb_cfg',{}));
const S=ls.get('pb_s',{days:{},xp:0});
const today=()=>S.days[dayKey()]||(S.days[dayKey()]={w:0,b:0,min:0});
let mode='work',left=cfg.work*60,end=0,tick=null;
const running=()=>!!tick,canPlay=()=>mode!=='work'&&running();
const lvXp=L=>60*(L-1)*(L-1),level=()=>Math.floor(Math.sqrt(S.xp/60))+1;
function streak(){let n=0,d=new Date();if(!S.days[dayKey(d)]?.w)d.setDate(d.getDate()-1);while(S.days[dayKey(d)]?.w){n++;d.setDate(d.getDate()-1)}return n}
function burst(){if(document.documentElement.dataset.view!=='elegant')return;const f=$('fx');for(let i=0;i<28;i++){const s=document.createElement('i'),a=Math.random()*6.28,r=120+Math.random()*160;s.style.cssText=`--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r}px;background:hsl(${20+Math.random()*50} 90% 65%)`;f.append(s);setTimeout(()=>s.remove(),1400)}}

/* ---------- Timer ---------- */
function draw(){
  const t=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`,td=today(),pct=left/(cfg[mode]*60);
  $('time').textContent=t;document.title=running()?`${t} · Pomodoro Ben`:'Pomodoro Ben';
  if($('arc'))$('arc').style.strokeDashoffset=804.25*(1-pct);
  if($('bar'))$('bar').style.width=(100-pct*100)+'%';
  document.body.dataset.mode=mode==='work'?'work':'rest';
  $('timerCard')?.classList.toggle('rest',mode!=='work');
  $('start').textContent=running()?'Pause':document.documentElement.dataset.view==='minimal'?'Start':mode==='work'?'Start focus':'Start break';
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
  if($('dots'))$('dots').innerHTML=Array.from({length:cfg.goal},(_,i)=>`<i class="${i<td.w?'on':''}"></i>`).join('')+`<span>&nbsp;${td.w}/${cfg.goal} today</span>`;
  if($('stats'))$('stats').textContent=`Today: ${td.w} focus sessions, ${td.b} breaks`;
  if($('streak'))$('streak').textContent=`${streak()}-day streak`;
  if($('lvl'))$('lvl').textContent=`Level ${level()}`;
  if($('chessTime'))$('chessTime').textContent=canPlay()?`Break time left · ${t}`:'Unlocks while a break timer is running';
  $('overlay').classList.toggle('show',!canPlay());
}
function setMode(m){clearInterval(tick);tick=null;mode=m;left=cfg[m]*60;draw()}
function finish(){
  const was=mode,t=today();let msg='Break over. Ready for the next one?';
  if(was==='work'){
    const L=level();t.w++;t.min+=cfg.work;S.xp+=cfg.work;
    msg=t.w===cfg.goal?'Daily goal reached. Nicely done.':level()>L?`Level ${level()} reached!`:`Session complete. +${cfg.work} XP`;burst();
  }else t.b++;
  ls.set('pb_s',S);chime(true);toast(msg);
  setMode(was==='work'?(t.w%4===0?'long':'short'):'work');
}
function toggleTimer(){
  if(running()){clearInterval(tick);tick=null}
  else{chime();end=Date.now()+left*1000;tick=setInterval(()=>{left=Math.max(0,Math.ceil((end-Date.now())/1000));left?draw():finish()},250)}

  const waveHtml=(waveBlocked?'<div class="warn">Turn off ambient noises to use brainwaves.</div>':'')+
    WAVES.map(([id,n,r,d])=>{const onn=amb.waves.includes(id),dis=waveBlocked||(!onn&&amb.waves.length>=MAX_WAVES);
      return `<button class="item${onn?' on':''}${dis?' dis':''}" data-k="w" data-id="${id}"><span><b>${n}</b> · ${r}<small>${d}</small></span><span class="ck">✓</span></button>`}).join('')+
    '<p class="mute" style="font-size:.72rem;margin-top:8px;text-align:left">Binaural beats work best with headphones.</p>';
  const freqHtml='<div class="freqs">'+FREQS.map(([f,l])=>`<button class="fb${amb.freqs.includes(f)?' on':''}" data-k="f" data-id="${f}"><b>${f} Hz</b><small>${l}</small></button>`).join('')+'</div>';
  box.innerHTML=sec('n','☁ Ambient Noises','Pick one',noiseHtml)+sec('w','🧠 Brainwaves','Up to 2',waveHtml)+sec('f','★ Popular Frequencies','Quick select',freqHtml);
  box.onclick=e=>{
    const b=e.target.closest('[data-k]');if(!b)return;
    const {k,id}=b.dataset;
    if(k==='s')ambOpen[id]=!ambOpen[id];
    else if(k==='n')toggleNoise(id);
    else if(k==='w')toggleWave(id);
    else if(k==='f')toggleFreq(+id);
    renderAmb();
  };
}

/* ---------- Chess ---------- */
const game=new Chess();let board,bot,thinking=false,cmode='bot',sol=[],pi=0,pc='w',solved=false;
function status(){
  const t=game.turn()==='w'?'White':'Black';
  $('cstatus').textContent=game.in_checkmate()?`Checkmate. ${t==='White'?'Black':'White'} wins.`:game.in_draw()?'Draw.':t+' to move'+(game.in_check()?' (check)':'');
}
function applyUci(u){game.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||'q'});board.position(game.fen());status()}
function initBot(){
  fetch('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js').then(r=>r.text()).then(c=>{
    bot=new Worker(URL.createObjectURL(new Blob([c],{type:'text/javascript'})));
    bot.onmessage=e=>{const m=/^bestmove (\S+)/.exec(e.data);if(m&&thinking){thinking=false;$('think').hidden=true;if(m[1]!=='(none)')applyUci(m[1])}};
    bot.postMessage('uci');
  }).catch(()=>{});
}
function botMove(){
  if(!bot||game.game_over()||!canPlay())return;
  thinking=true;$('think').hidden=false;
  bot.postMessage('setoption name Skill Level value '+$('level').value);
  bot.postMessage('position fen '+game.fen());bot.postMessage('go movetime 800');
}
async function loadPuzzle(){
  if(!canPlay())return;
  if(MY_PUZZLES.length){
    const p=MY_PUZZLES[Math.floor(Math.random()*MY_PUZZLES.length)],mv=p.solution||p.moves,m0=mv[0];
    game.load(p.fen);game.move({from:m0.slice(0,2),to:m0.slice(2,4),promotion:m0[4]||'q'});
    sol=mv.slice(1);pi=0;solved=false;pc=game.turn();
    board.orientation(pc==='w'?'white':'black');board.position(game.fen());status();
    $('pmsg').textContent=(p.description||p.note||'Puzzle')+'. Find the best move.';return;
  }
  $('pmsg').textContent='Loading puzzle…';
  try{
    const d=await (await fetch('https://lichess.org/api/puzzle/next',{headers:{Accept:'application/json'}})).json();
    game.load_pgn(d.game.pgn);sol=d.puzzle.solution;pi=0;solved=false;pc=game.turn();
    board.orientation(pc==='w'?'white':'black');board.position(game.fen());status();
    $('pmsg').textContent=`Rating ${d.puzzle.rating}. Find the best move.`;
  }catch{$('pmsg').textContent='Could not load a puzzle. Check your connection and try again.'}
}
function checkPuzzle(m){
  if(m.from+m.to+(m.promotion||'')!==sol[pi]&&!(m.from+m.to===sol[pi].slice(0,4))){
    game.undo();$('pmsg').textContent='Not quite. Try again.';return false;
  }
  pi++;
  const done=()=>{solved=true;$('pmsg').textContent='Puzzle solved!';chime(true)};
  if(pi>=sol.length){done();return true}
  setTimeout(()=>{applyUci(sol[pi]);pi++;pi>=sol.length?done():$('pmsg').textContent='Correct. Keep going.'},350);
  return true;
}
function newGame(){
  if(!canPlay())return;
  if(cmode==='puzzle')return loadPuzzle();
  game.reset();board.orientation('white');board.start();thinking=false;$('think').hidden=true;$('pmsg').textContent='';status();
}
function initChess(){
  board=Chessboard('board',{
    draggable:true,position:'start',pieceTheme:'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
    onDragStart:(s,p)=>canPlay()&&!game.game_over()&&!thinking&&!solved&&p[0]===game.turn()&&(cmode==='bot'?game.turn()==='w':game.turn()===pc),
    onDrop:(s,t)=>{
      const m=game.move({from:s,to:t,promotion:'q'});if(!m)return'snapback';
      if(cmode==='puzzle'){if(!checkPuzzle(m))return'snapback'}else if(!game.game_over())setTimeout(botMove,300);
      status();
    },
    onSnapEnd:()=>board.position(game.fen())
  });
  board.position(game.fen());if(cmode==='puzzle')board.orientation(pc==='w'?'white':'black');if(!window._rz){window._rz=1;window.addEventListener('resize',()=>board&&board.resize())}
}

/* ---------- Chess: float / enlarge ---------- */
let chessFloat=false,chessPh=null;
const SVG_OPEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
const ICON_EXPAND=SVG_OPEN+'<path d="M10 10L4 4M4 9V4h5"/><path d="M14 10l6-6M15 4h5v5"/><path d="M10 14l-6 6M4 15v5h5"/><path d="M14 14l6 6M20 15v5h-5"/></svg>';
const ICON_SHRINK=SVG_OPEN+'<path d="M4 4l6 6M5 10h5V5"/><path d="M20 4l-6 6M14 5v5h5"/><path d="M4 20l6-6M5 14h5v5"/><path d="M20 20l-6-6M14 19v-5h5"/></svg>';
function setZoomIcon(){const z=$('chessZoom');if(!z)return;z.innerHTML=chessFloat?ICON_SHRINK:ICON_EXPAND;const t=chessFloat?'Close enlarged board':'Enlarge chess board';z.title=t;z.setAttribute('aria-label',t)}
function setChessFloat(v){
  const box=$('chessBox');if(!box||v===chessFloat)return;
  if(v){
    chessPh=document.createElement('div');box.replaceWith(chessPh);
    const bd=document.createElement('div');bd.id='chessBackdrop';bd.onclick=()=>setChessFloat(false);
    document.body.append(bd,box);box.classList.add('float');
  }else{
    box.classList.remove('float');$('chessBackdrop')?.remove();
    if(chessPh){chessPh.replaceWith(box);chessPh=null}
  }
  chessFloat=v;
  setZoomIcon();
  setTimeout(()=>board&&board.resize(),60);
}

/* ---------- Chat (Firebase) ---------- */
const firebaseConfig={apiKey:"AIzaSyBTV95nlUb0nkH8jRSQFvXTI1tcDGYFuFU",authDomain:"pomodoro-ben.firebaseapp.com",databaseURL:"https://pomodoro-ben-default-rtdb.firebaseio.com",projectId:"pomodoro-ben",storageBucket:"pomodoro-ben.appspot.com",messagingSenderId:"123456789",appId:"1:123456789:web:abcdef123456"};
let db,uid,nick=ls.get('pb_nick',''),room=null,msgRef=null,roomData={};
function initChat(){
  firebase.initializeApp(firebaseConfig);
  firebase.auth().signInAnonymously().then(u=>{
    uid=u.user.uid;db=firebase.database();
    db.ref('rooms/general').once('value').then(s=>{if(!s.exists())db.ref('rooms/general').set({name:'General Chat',password:'',createdAt:Date.now(),creator:'system',isPublic:true})});
    db.ref('rooms').on('value',drawRooms);
  }).catch(()=>{if($('rooms'))$('rooms').textContent='Chat is unavailable right now.'});
}
let lastSnap;function drawRooms(snap){lastSnap=snap;if(!$('rooms'))return;
  const box=$('rooms');box.innerHTML='';roomData={};
  const list=[];snap.forEach(c=>{list.push({id:c.key,...c.val()})});
  list.sort((a,b)=>(b.isPublic?1:0)-(a.isPublic?1:0)||b.createdAt-a.createdAt);
  list.forEach(r=>{
    roomData[r.id]=r;
    const d=document.createElement('div');d.className='room';
    d.innerHTML='<span></span><small class="mute"></small>';
    d.firstChild.textContent=r.name;d.lastChild.textContent=r.isPublic?'Public':'Private';
    d.onclick=()=>joinRoom(r.id);box.append(d);
  });
}
function ensureNick(){
  if(!nick){nick=(prompt('Pick a nickname')||'').trim().slice(0,20);ls.set('pb_nick',nick)}
  return !!nick;
}
function joinRoom(id){
  const r=roomData[id];if(!r||!ensureNick())return;
  if(r.password&&prompt('Room password')!==r.password)return toast('Wrong password');
  room=id;$('lobby').hidden=true;$('chat').hidden=false;$('roomName').textContent=r.name;
  $('delRoom').hidden=r.creator!==uid;$('msgs').innerHTML='';
  msgRef=db.ref(`rooms/${id}/messages`);
  msgRef.limitToLast(100).on('child_added',s=>addMsg(s.val()));
}
function addMsg(m){
  const d=document.createElement('div'),box=$('msgs');
  d.className='m'+(m.type==='system'?' sys':m.uid===uid?' own':'');
  if(m.type==='system')d.textContent=m.text;
  else{const s=document.createElement('small'),p=document.createElement('p');s.textContent=m.user+' · '+new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});p.textContent=m.text;d.append(s,document.createElement('br'),p)}
  box.append(d);box.scrollTop=box.scrollHeight;
}
function sendMsg(){
  const v=$('msgIn').value.trim();if(!v||!room)return;
  msgRef.push({user:nick,uid,text:v,ts:Date.now()});$('msgIn').value='';
}
function leaveRoom(){if(msgRef)msgRef.off();room=msgRef=null;$('chat').hidden=true;$('lobby').hidden=false}
function createRoom(){
  if(!ensureNick())return;
  const name=(prompt('Room name')||'').trim(),pw=(prompt('Room password')||'').trim();
  if(!name||!pw)return toast('A room needs a name and a password');
  db.ref('rooms').push({name,password:pw,createdAt:Date.now(),creator:uid,isPublic:false});
}
function deleteRoom(){if(confirm('Delete this room and all its messages?')){const id=room;leaveRoom();db.ref('rooms/'+id).remove()}}

/* ---------- Views, panels & wiring ---------- */
const TITLES={tasks:'Tasks',cal:'Calendar',sound:'Soundscape',chess:'Chess',chat:'Chat',you:'Your progress'};
let openP=null;
function closeSheet(){openP=null;$('sheet')?.classList.remove('open');document.querySelectorAll('.dock button').forEach(b=>b.classList.remove('on'))}
function openPanel(p){
  if(openP===p)return closeSheet();
  openP=p;document.querySelectorAll('.panel').forEach(x=>x.hidden=x.id!=='p-'+p);
  $('sTitle').textContent=TITLES[p];$('sheet').classList.add('open');
  document.querySelectorAll('.dock button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  if(p==='chess'){if(!board){initChess();status()}setTimeout(()=>board&&board.resize(),360)}
  if(p==='you')drawYou();
}
function applyTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('pb_theme',t)}catch{}const b=$('theme');if(b)b.textContent=t==='dark'?'☀':'☾'}
const QUOTES=['Great things are done by a series of small things brought together.','The secret of getting ahead is getting started.','Where focus goes, energy flows.','Consistency always beats intensity.','Motivation is a feeling, but discipline is a choice.','Do what you can, with what you have, where you are.'];
const quote=()=>{const q=$('quote');if(q)q.textContent=QUOTES[Math.floor(Math.random()*QUOTES.length)]};
function wire(){
  [['cw','work'],['cs','short'],['cl','long'],['cg','goal']].forEach(([id,k])=>{const e=$(id);if(!e)return;e.value=cfg[k];e.onchange=()=>{cfg[k]=Math.max(1,parseInt(e.value)||cfg[k]);ls.set('pb_cfg',cfg);setMode(mode)}});
  document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
  document.querySelectorAll('.dock button').forEach(b=>b.onclick=()=>openPanel(b.dataset.p));
  on('sClose','click',closeSheet);on('start','click',toggleTimer);on('reset','click',()=>setMode(mode));
  const f=$('focusIn');if(f){f.value=ls.get('pb_focus','');f.oninput=()=>ls.set('pb_focus',f.value)}
  on('addTask','click',addTask);on('taskIn','keydown',e=>e.key==='Enter'&&addTask());
  on('prev','click',()=>{if(--cm<0){cm=11;cy--}drawCal()});on('next','click',()=>{if(++cm>11){cm=0;cy++}drawCal()});
  $('note').value=ls.get('pb_note','');on('note','input',()=>ls.set('pb_note',$('note').value));
  on('saveNote','click',()=>{const v=$('note').value.trim();if(!v)return toast('Write something first');pushNote(dayKey(),v);$('note').value='';ls.set('pb_note','');toast('Saved to today')});
  const vol=$('vol'),vv=()=>{$('volVal').textContent=Math.round(vol.value*100)+'%'};
  vol.value=mg?mg.gain.value:.5;vv();
  on('vol','input',()=>{if(mg)mg.gain.value=vol.value;vv()});on('stopAll','click',stopAudio);
  $('cmode').value=cmode;$('level').hidden=$('undo').hidden=cmode==='puzzle';$('newGame').textContent=cmode==='puzzle'?'New puzzle':'New game';
  on('cmode','change',e=>{cmode=e.target.value;$('level').hidden=$('undo').hidden=cmode==='puzzle';$('newGame').textContent=cmode==='puzzle'?'New puzzle':'New game';game.reset();board.start();board.orientation('white');$('pmsg').textContent='';status();newGame()});
  on('newGame','click',newGame);
  on('undo','click',()=>{if(canPlay()&&!thinking){game.undo();game.undo();board.position(game.fen());status()}});
  setZoomIcon();on('chessZoom','click',()=>setChessFloat(!chessFloat));
  on('newRoom','click',createRoom);on('leave','click',leaveRoom);on('delRoom','click',deleteRoom);
  on('send','click',sendMsg);on('msgIn','keydown',e=>e.key==='Enter'&&sendMsg());
  on('theme','click',()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
}
function mount(v){
  setChessFloat(false);
  if(room)leaveRoom();
  document.documentElement.dataset.view=v;try{localStorage.setItem('pb_view',v)}catch{}
  $('app').replaceChildren($('t-'+v).content.cloneNode(true));
  openP=null;board=null;
  document.querySelectorAll('#views button').forEach(b=>{b.classList.toggle('on',b.dataset.v===v);b.onclick=()=>b.dataset.v!==v&&mount(b.dataset.v)});
  renderAmb();wire();draw();drawTasks();drawCal();quote();applyTheme(document.documentElement.dataset.theme);
  if(lastSnap)drawRooms(lastSnap);
  if(v==='minimal'){initChess();status();setTimeout(()=>board&&board.resize(),60)}
}
window.onload=()=>{
  on('closeDay','click',()=>$('dayDlg').close());
  const add=()=>{const v=$('noteIn').value.trim();if(v){pushNote(sel,v);$('noteIn').value='';drawNotes()}};
  on('addNote','click',add);on('noteIn','keydown',e=>e.key==='Enter'&&add());
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){if(chessFloat)return setChessFloat(false);closeSheet()}
    if(e.code==='Space'&&!/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName)){e.preventDefault();toggleTimer()}
  });
  mount(document.documentElement.dataset.view);initBot();initChat();setInterval(quote,20000);
};
